<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
    <!--
      Stylesheet for browsers that cannot render the Tailwind CSS v4 bundle (no
      cascade layers, oklch() or color-mix()). It is built from Tailwind CSS v3
      by `bun run build`. The script below removes the link before it applies
      in browsers that support the v4 features. See
      docs/legacy-browser-support.md.
    -->
    <link id="legacy-css" rel="stylesheet" href="%sveltekit.assets%/legacy.css" />
    <script>
      (function () {
        var root = document.documentElement;

        // Browsers without flexbox `gap` need the margin fallbacks in
        // legacy.css, which only apply under this class. The probe reports
        // true if the two children end up 10px apart.
        function flexGapSupported() {
          try {
            var probe = document.createElement("div");
            probe.style.cssText = "display:flex;gap:10px;position:absolute;top:-1000px;left:-1000px;visibility:hidden";
            var first = document.createElement("i");
            var second = document.createElement("i");
            first.style.cssText = second.style.cssText = "width:10px;height:10px";
            probe.appendChild(first);
            probe.appendChild(second);
            root.appendChild(probe);
            var supported = second.getBoundingClientRect().left - first.getBoundingClientRect().right > 9;
            root.removeChild(probe);
            return supported;
          } catch (error) {
            return true;
          }
        }
        if (!flexGapSupported()) {
          root.className = root.className ? root.className + " no-flex-gap" : "no-flex-gap";
        }

        // The legacy stylesheet applies by default; it is only removed when
        // the browser supports everything the Tailwind v4 bundle needs.
        // Feature detection is used instead of a user-agent check because
        // browsers like Pale Moon support some v4 CSS (oklch, color-mix) but
        // not all of it (@property, individual transform properties).
        var link = document.getElementById("legacy-css");
        if (!link) return;
        try {
          var modern =
            typeof CSS !== "undefined" &&
            CSS.supports &&
            typeof CSSLayerBlockRule !== "undefined" &&
            typeof CSSPropertyRule !== "undefined" &&
            CSS.supports("color", "oklch(0 0 0)") &&
            CSS.supports("color", "color-mix(in srgb, red, blue)") &&
            CSS.supports("selector(:where(a))") &&
            CSS.supports("translate", "1px");
          if (modern) link.parentNode.removeChild(link);
        } catch (error) {
          /* keep the fallback stylesheet when detection fails */
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" class="font-sans antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
