<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
    <!--
      Stylesheet for browsers that cannot render the Tailwind CSS v4 bundle (no
      cascade layers, oklch() or color-mix()). It is built from Tailwind CSS v3
      by `bun run build`. The inline script below removes the link before it
      applies in browsers that support the v4 features. See
      docs/legacy-browser-support.md.
    -->
    <link id="legacy-css" rel="stylesheet" href="%sveltekit.assets%/legacy.css" />
    <script>
      (function () {
        var link = document.getElementById("legacy-css");
        if (!link) return;
        try {
          var modern =
            typeof CSS !== "undefined" &&
            CSS.supports &&
            CSS.supports("color", "oklch(0 0 0)") &&
            CSS.supports("color", "color-mix(in srgb, red, blue)");
          if (modern) link.parentNode.removeChild(link);
        } catch (error) {
          /* keep the fallback stylesheet when detection fails */
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" class="font-sans antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
